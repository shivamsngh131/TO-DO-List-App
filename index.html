<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — a daily task ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="34" height="34">
            <path d="M8 6h24a2 2 0 0 1 2 2v26l-6-4-6 4-6-4-6 4V8a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
            <line x1="13" y1="14" x2="27" y2="14" stroke="currentColor" stroke-width="2"/>
            <line x1="13" y1="20" x2="23" y2="20" stroke="currentColor" stroke-width="2"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>Ledger<span class="brand-underline"></span></h1>
          <p class="tagline">Today's tasks, kept plainly.</p>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme" title="Switch theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4.2"/><line x1="12" y1="19.8" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4.2" y2="12"/><line x1="19.8" y1="12" x2="22.5" y2="12"/><line x1="4.4" y1="4.4" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.6" y2="4.4"/></g></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <form class="add-form" id="addForm">
        <input type="text" id="taskInput" placeholder="Write a new line…" autocomplete="off" required maxlength="120" />
        <div class="add-row">
          <div class="priority-select" role="radiogroup" aria-label="Priority">
            <button type="button" class="pri-dot pri-low" data-priority="low" aria-label="Low priority"></button>
            <button type="button" class="pri-dot pri-medium is-active" data-priority="medium" aria-label="Medium priority"></button>
            <button type="button" class="pri-dot pri-high" data-priority="high" aria-label="High priority"></button>
          </div>
          <input type="date" id="dueInput" aria-label="Due date" />
          <button type="submit" class="stamp-btn" aria-label="Add task">
            <svg viewBox="0 0 24 24" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </form>

      <div class="progress-block">
        <div class="progress-ring">
          <svg width="76" height="76" viewBox="0 0 76 76">
            <circle cx="38" cy="38" r="32" class="ring-track" />
            <circle cx="38" cy="38" r="32" class="ring-fill" id="ringFill" />
          </svg>
          <span class="progress-num" id="progressPct">0%</span>
        </div>
        <div class="progress-copy">
          <p class="progress-count"><span id="doneCount">0</span> of <span id="totalCount">0</span> closed out</p>
          <p class="progress-sub" id="progressSub">Keep the ledger tidy.</p>
        </div>
      </div>

      <nav class="filters" aria-label="Filter tasks">
        <span class="filters-label">Show</span>
        <div class="filter-chips" id="statusFilters">
          <button class="chip is-active" data-filter="all" type="button">All</button>
          <button class="chip" data-filter="active" type="button">Open</button>
          <button class="chip" data-filter="completed" type="button">Closed</button>
        </div>
        <span class="filters-label">Priority</span>
        <div class="filter-chips" id="priorityFilters">
          <button class="chip is-active" data-priority-filter="all" type="button">All</button>
          <button class="chip" data-priority-filter="low" type="button"><i class="dot pri-low"></i>Low</button>
          <button class="chip" data-priority-filter="medium" type="button"><i class="dot pri-medium"></i>Med</button>
          <button class="chip" data-priority-filter="high" type="button"><i class="dot pri-high"></i>High</button>
        </div>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="groups" id="groups">
        <!-- populated by script.js -->
      </div>

      <div class="empty-state" id="emptyState" hidden>
        <svg viewBox="0 0 120 90" width="108" class="empty-illustration">
          <path d="M14 10h92a4 4 0 0 1 4 4v62a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="24" y1="30" x2="70" y2="30" stroke="currentColor" stroke-width="2"/>
          <line x1="24" y1="42" x2="86" y2="42" stroke="currentColor" stroke-width="2"/>
          <line x1="24" y1="54" x2="60" y2="54" stroke="currentColor" stroke-width="2"/>
          <path class="empty-check" d="M40 64l10 10 22-22" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="empty-title" id="emptyTitle">The page is blank.</p>
        <p class="empty-sub" id="emptySub">Write the first line above and it'll land here.</p>
      </div>
    </main>

  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <template id="taskRowTemplate">
    <li class="task-row" draggable="true">
      <button class="check" type="button" aria-label="Mark complete">
        <svg viewBox="0 0 24 24" width="13" height="13"><polyline class="check-mark" points="4,13 9,18 20,6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="task-text" tabindex="0" role="textbox" aria-label="Task text"></span>
      <span class="task-meta">
        <i class="dot"></i>
        <span class="due-chip"></span>
      </span>
      <button class="drag-handle" type="button" aria-label="Reorder task" tabindex="-1">
        <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="8" cy="6" r="1.4" fill="currentColor"/><circle cx="8" cy="12" r="1.4" fill="currentColor"/><circle cx="8" cy="18" r="1.4" fill="currentColor"/><circle cx="16" cy="6" r="1.4" fill="currentColor"/><circle cx="16" cy="12" r="1.4" fill="currentColor"/><circle cx="16" cy="18" r="1.4" fill="currentColor"/></svg>
      </button>
      <button class="delete-btn" type="button" aria-label="Delete task">
        <svg viewBox="0 0 24 24" width="14" height="14"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </li>
  </template>

  <script src="index.js"></script>
</body>
</html>
